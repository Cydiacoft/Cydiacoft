name: Refresh Digital Journal
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'test/**', 'profile.config.json', 'package.json', '.github/workflows/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm test
  refresh:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Render public data
        run: npm run generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit successful refresh only
        run: |
          git add -- README.md assets/hero-light.svg assets/hero-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public digital journal"
          git push
